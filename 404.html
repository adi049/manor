<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f7f3">
  <link id="siteFavicon" rel="icon" type="image/png" sizes="128x128" href="assets/img/favicon.png">
  <title>Page not found | HOTEL ND MANOR</title>
  <style>
    :root{--paper:#f8f7f3;--ink:#282422;--brown:#332b28;--magenta:#96516f;--muted:#746c66;--line:#e3ded6;--red:#b7554d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(680px,100%);padding:clamp(28px,7vw,70px);border:1px solid var(--line);background:#fffefa;box-shadow:0 18px 54px rgba(47,38,34,.08)}
    .mark{color:var(--magenta);font-size:.67rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:18px 0 12px;color:var(--brown);font:400 clamp(2.7rem,8vw,5.1rem)/.95 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
    p{max-width:480px;margin:0;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}
    .actions a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 18px;border:1px solid var(--brown);color:#fff;background:var(--brown);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-decoration:none;text-transform:uppercase}
    .actions a.alt{border-color:var(--red);background:var(--red)}.actions a:hover{filter:brightness(.93)}
    .policy-links{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:.68rem}
    .policy-links a{color:var(--magenta);text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark">HOTEL ND MANOR · Dehradun</div>
    <h1>That page<br>isn't here.</h1>
    <p>The address may have changed. Return to the hotel homepage or contact the team directly.</p>
    <div class="actions"><a id="homeLink" href="index.html">Back to home ↗</a><a class="alt" href="tel:+919968407707">Call +91 99684 07707</a></div>
    <footer class="site-footer policy-links"><a id="privacyLink" href="privacy-policy.html">Privacy Policy</a><a id="termsLink" href="terms-and-conditions.html">Terms &amp; Conditions</a></footer>
  </main>

  <script>
    (function () {
      var projectRoot = "/LiveNDMARON/";
      var isProjectPage = location.hostname === "adi049.github.io" && location.pathname.indexOf(projectRoot) === 0;
      var siteRoot = isProjectPage ? projectRoot : "/";
      document.getElementById("homeLink").href = siteRoot;
      document.getElementById("privacyLink").href = siteRoot + "privacy-policy.html";
      document.getElementById("termsLink").href = siteRoot + "terms-and-conditions.html";
      document.getElementById("siteFavicon").href = siteRoot + "assets/img/favicon.png";
    })();
  </script>
</body>
</html>
